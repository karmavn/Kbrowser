[package]
name = "kbrowser"
version = "3.5.0"
edition = "2024"
license="MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables multiwebview (Window::add_child), needed for tabs.
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-single-instance = "2"

# Same versions Tauri resolves, so there is a single copy of each.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
