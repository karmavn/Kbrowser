name: Build Kbrowser Windows

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện web GitHub
  push:
    branches:
      - main
      - master
      - optimize-perf
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build with Tauri CLI
        run: |
          npx @tauri-apps/cli build

      - name: Copy portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item -Path "src-tauri/target/release/kbrowser.exe" -Destination "dist/Kbrowser-portable.exe"
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination "dist/"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kbrowser-Windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
