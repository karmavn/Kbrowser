name: Build Kbrowser Windows

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện web GitHub
  push:
    branches:
      - main
      - master
      - optimize-perf
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Check frontend JS syntax
        run: |
          node --check src/app.js
          node --check src/ext.js
          node --check src/new.js
          node --check src/settings.js

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build with Tauri CLI
        run: |
          npx --yes @tauri-apps/cli@2.12.6 build -- --locked

      - name: Copy portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item -Path "src-tauri/target/release/kbrowser.exe" -Destination "dist/Kbrowser-portable.exe"
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination "dist/"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kbrowser-Windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kbrowser-Windows-x64
          path: dist

      - name: Create GitHub Release (On Tag)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
